---
name: Release

# Publishing the GitHub release is the trigger, not pushing the tag.
#
# The changelog in readme.txt is generated from the release notes, and at the moment
# a tag is pushed the release for it does not exist yet, so a tag-triggered deploy
# would ship a readme whose changelog stopped at the previous version. Releases are
# cut by hand anyway (`gh release create <tag> --notes-file readme/next-release.md`),
# so this waits for the step that produces the notes rather than the step before it.
#
# Consequence worth knowing: pushing a tag alone no longer deploys anything.
on:
  release:
    types: [published]

# Write, only because the built zip is attached back to the release.
permissions:
  contents: write

# Publishing to SVN is not idempotent, and GitHub has been observed delivering an
# event twice. Serialize per tag so a duplicate waits rather than racing.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Release to WordPress.org
    runs-on: ubuntu-24.04
    # A prerelease is for testing the pipeline and for handing someone a zip. It is
    # not a WordPress.org release, and WordPress.org has no concept of one.
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # A release cut without bumping package.json used to deploy silently, which
      # is invisible from the WordPress.org side. Refuse instead.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg=$(bun --print "require('./package.json').version")
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg"

      # And that the plugin header agrees with it.
      - name: Verify plugin header
        run: bun run version:check

      - name: Build signage assets
        run: bun run build

      - name: Committed assets match a fresh build
        run: git diff --exit-code -- screenly-cast/assets/dist

      # This is the step the trigger exists for: the changelog is read from the
      # published releases, which now includes the one being deployed.
      - name: Render readme.txt and changelog.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run readme

      # The deployed listing is what WordPress.org shows, so put it in the log where
      # it can be read after the fact rather than only inferred from the SVN diff.
      - name: Show the generated readme.txt
        run: cat screenly-cast/readme.txt

      - name: Build distributable
        run: ./bin/build.sh

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: screenly-cast
          BUILD_DIR: build/screenly-cast
          ASSETS_DIR: .wordpress-org

      # The zip that was actually deployed, attached to the release that triggered
      # this run. Release assets do not expire, which is what makes the build durable
      #, artifacts top out at GitHub's 90-day ceiling for public repositories, and
      # there is no indefinite retention at any value.
      - name: Attach the built zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/screenly-cast.zip --clobber
