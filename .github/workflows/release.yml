---
name: Release

on:
  push:
    tags:
      # CalVer, matching signage-kit: YYYY.M.MICRO, optionally with a prerelease
      # suffix. Note this is not the old `vX.Y.Z` scheme.
      - '[0-9][0-9][0-9][0-9].*'

permissions:
  contents: write

# Publishing to SVN is not idempotent, and GitHub has been observed delivering a
# tag push event twice. Serialise per tag so a duplicate waits rather than racing.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Release to WordPress.org
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # A tag pushed without bumping package.json used to deploy silently, which
      # is invisible from the WordPress.org side. Refuse instead.
      - name: Verify tag matches package.json version
        run: |
          pkg=$(bun --print "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg"

      # And that the plugin header + readme.txt stable tag agree with it.
      - name: Verify plugin header and stable tag
        run: bun run version:check

      - name: Build signage assets
        run: bun run build

      - name: Committed assets match a fresh build
        run: git diff --exit-code -- screenly-cast/assets/dist

      - name: Build distributable
        run: ./bin/build.sh

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: screenly-cast
          BUILD_DIR: build/screenly-cast
          ASSETS_DIR: .wordpress-org

      # The zip that was actually deployed, kept so a release can attach it without
      # rebuilding. Releases are cut by hand with `gh release create <tag>
      # dist/screenly-cast.zip` rather than by a third-party action.
      #
      # 90 days is GitHub's ceiling for artifacts on a public repository, not a
      # choice — there is no indefinite retention for artifacts at any value. The
      # permanent copy of a build is the release asset, which does not expire, so
      # attaching this zip to the release is what makes it durable.
      - name: Upload the built zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenly-cast-${{ github.ref_name }}
          path: dist/screenly-cast.zip
          retention-days: 90
