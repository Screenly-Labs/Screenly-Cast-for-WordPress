---
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  js:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # The plugin header and the SRLY_VERSION constant both derive from
      # package.json. Catch drift here rather than at release.
      - name: Version consistency
        run: bun run version:check

      - name: Lint (Biome + markdownlint)
        run: bun run lint

      # readme.txt is generated, so the thing to check is that it can be generated:
      # the markdown converts, the short description and tag count are legal, and the
      # result is inside WordPress.org's 10,000-byte limit. Run against the real
      # releases so the changelog path is exercised too, not just the listing.
      - name: Render readme.txt and changelog.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run readme

      # shellcheck ships on the runner image, so this needs no third-party action.
      # --severity=style because the shipped scripts are clean at that level and
      # there is no reason to let them regress to merely "no errors".
      - name: Lint shell scripts
        run: shellcheck --severity=style --format=gcc bin/*.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Build signage assets
        run: bun run build

      # WordPress.org ships no build step, so screenly-cast/assets/dist is
      # committed. If a fresh build differs from what is committed, the plugin
      # would ship stale CSS/JS and nothing else would notice.
      - name: Committed assets match a fresh build
        run: git diff --exit-code -- screenly-cast/assets/dist

  php-static:
    name: PHP static analysis (strict)
    runs-on: ubuntu-24.04
    # PHP runs in the official image via ./bin/php.sh rather than through
    # shivammathur/setup-php. There is no official GitHub action for PHP, but there
    # are official Docker images for both PHP and Composer, so a third party in the
    # trust path — one that takes the job's GITHUB_TOKEN by default, through an
    # input we never asked for — buys nothing here.
    #
    # It also runs the analysis on 8.2, the version this plugin claims as its floor,
    # instead of whatever the action was asked to install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --strict also rejects a lock file that has drifted from composer.json.
      - name: Validate composer.json and composer.lock
        run: ./bin/php.sh composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: ./bin/php.sh composer install --no-interaction --no-progress

      - name: Audit dependencies for advisories
        run: ./bin/php.sh composer audit --no-interaction

      # Every PHP file must compile. Catches a syntax error in a file that no
      # test happens to load, such as a template or uninstall.php.
      - name: Lint PHP syntax
        run: |
          ./bin/php.sh sh -c \
            "find screenly-cast tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null"

      # WordPress standards, plus the slevomat sniffs that make native parameter,
      # property and return types mandatory rather than optional. Run through the
      # composer scripts, not the binaries, so the flags cannot drift from local use.
      - name: PHP_CodeSniffer
        run: ./bin/php.sh composer run lint:php

      # PHPStan at level max, with phpstan-strict-rules and the deprecation rules.
      - name: PHPStan
        run: ./bin/php.sh composer run analyse

  php-tests:
    name: PHPUnit PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Full cross-product would be 12 environments for little extra signal.
        # Instead: every supported PHP against current WP, plus every supported
        # WP against our minimum PHP, plus newest PHP against trunk as an
        # early-warning cell.
        #
        # `ref` is stated explicitly rather than derived from `wp`, because the
        # mapping is not uniform: released versions have a tag, but 7.1 has only a
        # branch until it ships, and trunk is a branch by definition. Deriving
        # `tags/<version>` silently produced an unresolvable ref for 7.1 and every
        # one of those cells failed in wp-env rather than in a way that named the
        # cause. Swap 7.1 to `tags/7.1` once it is released.
        include:
          - { php: '8.2', wp: '7.1', ref: '7.1-branch' }
          - { php: '8.3', wp: '7.1', ref: '7.1-branch' }
          - { php: '8.4', wp: '7.1', ref: '7.1-branch' }
          - { php: '8.2', wp: '7.0', ref: 'tags/7.0.4' }
          - { php: '8.2', wp: '6.9', ref: 'tags/6.9.7' }
          - { php: '8.2', wp: '6.8', ref: 'tags/6.8.8' }
          - { php: '8.4', wp: 'trunk', ref: 'master' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # No PHP is installed on the runner for this job, and none is needed. PHPUnit
      # runs inside wp-env at the matrix version — see the override file written
      # below — so the only thing a host PHP was ever doing here was running
      # Composer, which the official image does. Installing a matching PHP on the
      # host also read as though it were the version under test, which it was not.
      - name: Install Composer dependencies
        run: ./bin/php.sh composer install --no-interaction --no-progress

      - name: Point wp-env at this matrix cell
        run: |
          core="WordPress/WordPress#${{ matrix.ref }}"
          printf '{\n  "core": "%s",\n  "phpVersion": "%s"\n}\n' \
            "$core" "${{ matrix.php }}" > .wp-env.override.json
          cat .wp-env.override.json

      - name: Start wp-env
        run: bun run env:start

      - name: PHPUnit
        run: bun run test:php

      - name: wp-env logs on failure
        if: failure()
        run: bunx wp-env logs tests --watch=false || true

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-24.04
    # Plugin Check summarises its findings as a comment on the pull request, which
    # is the whole point of running it here rather than reading a log. Posting that
    # needs pull-requests: write, and the workflow-level grant is contents: read —
    # so the action was failing at the last step with "Resource not accessible by
    # integration" and annotating every run with a warning.
    #
    # Scoped to this job, and contents: read is restated because a job-level block
    # replaces the workflow-level one outright rather than adding to it.
    #
    # This does not help a pull request from a fork: GITHUB_TOKEN is read-only there
    # whatever the workflow asks for. The action logs the failure and carries on, so
    # a fork PR still gets the check, just not the comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build signage assets
        run: bun run build

      # Plugin Check reads readme.txt, and it is generated rather than committed, so
      # without this the check would run against a plugin with no readme at all.
      - name: Render readme.txt and changelog.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run readme

      # The same Plugin Check the WordPress.org review team runs. Catching a
      # violation here is much cheaper than a rejected release.
      - name: Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: ./screenly-cast

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build signage assets
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Start wp-env
        run: bun run env:start
      - name: Seed the fixture corpus
        run: bun run env:seed
      - name: Playwright
        run: bun run test:e2e

      # The contact sheet is the artifact a human actually looks at, so publish
      # it whether or not the assertions passed.
      - name: Upload renders and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signage-renders
          path: |
            playwright-report
            test-results
            tests/e2e/.artifacts
          retention-days: 14
          if-no-files-found: ignore

  package:
    name: Package plugin zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build signage assets
        run: bun run build

      # build.sh refuses to package without readme.txt, which is generated.
      - name: Render readme.txt and changelog.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run readme

      - name: Build distributable
        run: ./bin/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenly-cast
          path: dist/screenly-cast.zip
          retention-days: 14
